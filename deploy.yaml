---
version: "2.0"

services:
  web:
    # Use specific nginx:alpine version tag (never use :latest)
    image: nginx:1.25.3-alpine
    expose:
      - port: 80
        as: 80
        to:
          - global: true
        accept:
          - permissionless.money

profiles:
  compute:
    web:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 1Gi

  placement:
    akash:
      attributes:
        host: akash
      signedBy:
        anyOf:
          - "akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63"
          - "akash18qa2a2ltfyvkyj0ggj3hkvuj6twzyumuaru9s4"
      pricing:
        web:
          denom: uakt
          amount: 1000

deployment:
  web:
    akash:
      profile: web
      count: 1
