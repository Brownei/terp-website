# The 'events' block is required for NGINX to function correctly
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name terp.network;

        root /usr/share/nginx/html;
        index index.html;

        # Serve main website
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Serve shell installer script at /run
        location /run {
            default_type text/plain;
            try_files /install/terp-installer.sh =404;
        }

        # Serve Python installer script at /install
        location /install {
            default_type text/plain;
            try_files /install/terp-installer.py =404;
        }

        # Add caching headers for static content
        location ~* \.(py|sh)$ {
            add_header Cache-Control "public, max-age=3600";
        }

        # Serve public assets (favicons, manifests, etc.)
        location /public/ {
            try_files $uri =404;
        }
    }
}
