<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Register your Terp Account Billboard on-chain. Human-readable identities for Terp Network addresses.">
    <title>TABS | Terp Network</title>

    <meta property="og:title" content="TABS | Terp Network">
    <meta property="og:description" content="Register your on-chain identity. Terp Account Billboards for Terp Network.">
    <meta property="og:type" content="website">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="TABS | Terp Network">
    <meta name="twitter:creator" content="@terpculture">

    <link rel="icon" type="image/x-icon" href="/public/favicon/terp-32x32.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon/terp-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon/terp-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/public/favicon/terp-apple-touch.png">

    <link rel="preconnect" href="https://fonts.cdnfonts.com/css/satoshi">
    <link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet">
    <link rel="stylesheet" href="/public/global.css">

    <style>
        /* Main */
        .main {
            position: relative; z-index: 1;
            max-width: 640px; width: 100%;
            margin: 0 auto;
            padding: 7rem 1.5rem 3rem;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center;
        }

        .page-title {
            font-size: 2.2rem; font-weight: 500;
            color: #cfffcf;
            text-shadow: 0 0 30px rgba(183, 255, 183, 0.07);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-size: 0.85rem; color: #ffffda;
            text-shadow: 0 0 3px rgba(71, 50, 102, 0.9);
            text-transform: uppercase; letter-spacing: 0.12em;
            text-align: center; margin-bottom: 2.5rem;
        }

        /* Search / Mint Card */
        .name-card {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(152, 232, 193, 0.15);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 0 40px rgba(152, 232, 193, 0.03);
        }

        .name-input-wrap {
            display: flex; gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .name-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(152, 232, 193, 0.2);
            border-radius: 6px;
            color: #f8f8f2; padding: 0.8rem 1rem;
            font-family: 'Satoshi', sans-serif;
            font-size: 1rem; outline: none;
            transition: border-color 0.2s ease;
        }
        .name-input::placeholder { color: rgba(210, 211, 216, 0.4); }
        .name-input:focus {
            border-color: rgba(152, 232, 193, 0.5);
            box-shadow: 0 0 15px rgba(152, 232, 193, 0.08);
        }

        .btn-check {
            background: rgba(152, 232, 193, 0.1);
            border: 1px solid rgba(152, 232, 193, 0.3);
            color: #98e8c1; padding: 0.8rem 1.2rem;
            font-family: 'Satoshi', sans-serif;
            font-size: 0.85rem; font-weight: 500;
            cursor: pointer; border-radius: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-check:hover {
            background: rgba(152, 232, 193, 0.2);
            border-color: rgba(152, 232, 193, 0.5);
        }
        .btn-check:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Status display */
        .name-status {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
            display: none;
        }
        .name-status.available {
            display: block;
            background: rgba(152, 232, 193, 0.08);
            border: 1px solid rgba(152, 232, 193, 0.25);
            color: #98e8c1;
        }
        .name-status.taken {
            display: block;
            background: rgba(254, 125, 125, 0.08);
            border: 1px solid rgba(254, 125, 125, 0.25);
            color: #fe7d7d;
        }
        .name-status.error {
            display: block;
            background: rgba(189, 147, 249, 0.08);
            border: 1px solid rgba(189, 147, 249, 0.25);
            color: #bd93f9;
        }

        /* Pricing info */
        .pricing-info {
            display: flex; gap: 1.5rem; flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .pricing-item {
            display: flex; flex-direction: column; gap: 0.15rem;
        }

        .pricing-label {
            font-size: 0.65rem; color: rgba(207, 255, 207, 0.5);
            text-transform: uppercase; letter-spacing: 0.1em;
        }

        .pricing-value {
            font-size: 1rem; color: #98e8c1; font-weight: 500;
        }

        /* Mint button */
        .btn-mint {
            width: 100%;
            background: linear-gradient(135deg, rgba(152, 232, 193, 0.15), rgba(152, 232, 193, 0.08));
            border: 1px solid rgba(152, 232, 193, 0.4);
            color: #cfffcf; padding: 0.9rem 1.5rem;
            font-family: 'Satoshi', sans-serif;
            font-size: 1rem; font-weight: 500;
            cursor: pointer; border-radius: 6px;
            transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 0.1em;
        }
        .btn-mint:hover {
            background: linear-gradient(135deg, rgba(152, 232, 193, 0.25), rgba(152, 232, 193, 0.15));
            border-color: rgba(152, 232, 193, 0.6);
            box-shadow: 0 0 25px rgba(152, 232, 193, 0.15);
            transform: translateY(-1px);
        }
        .btn-mint:active { transform: translateY(0); }
        .btn-mint:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Toast */
        .toast-container {
            position: fixed; bottom: 1.5rem; right: 1.5rem;
            z-index: 300; display: flex; flex-direction: column;
            gap: 0.5rem; max-width: 360px;
        }
        .toast {
            padding: 0.8rem 1.2rem; border-radius: 6px;
            font-size: 0.8rem; line-height: 1.4;
            backdrop-filter: blur(12px);
            animation: toast-in 0.3s ease forwards;
            border: 1px solid;
        }
        .toast.success { background: rgba(152, 232, 193, 0.1); border-color: rgba(152, 232, 193, 0.3); color: #98e8c1; }
        .toast.error { background: rgba(254, 125, 125, 0.1); border-color: rgba(254, 125, 125, 0.3); color: #fe7d7d; }
        .toast.info { background: rgba(189, 147, 249, 0.1); border-color: rgba(189, 147, 249, 0.3); color: #bd93f9; }
        .toast.removing { animation: toast-out 0.3s ease forwards; }

        @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toast-out { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(20px); } }

        /* Loading */
        .loading { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 2rem 0; color: #d2d3d8; }
        .spinner {
            width: 36px; height: 36px;
            border: 2px solid rgba(152, 232, 193, 0.2);
            border-top-color: #98e8c1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title { font-size: 1.6rem; }
            .page-subtitle { font-size: 0.7rem; }
            .header { padding: 0.5rem 1rem; }
            .header-nav { gap: 1rem; }
            .nav-link { font-size: 0.75rem; }
            .name-card { padding: 1.5rem; }
            .name-input-wrap { flex-direction: column; }
        }

        @media (max-width: 480px) {
            .btn-wallet { font-size: 0.7rem; padding: 0.4rem 0.6rem; }
        }
    </style>
</head>

<body>

    <canvas id="glow-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>

    <main class="main">
        <h1 class="page-title">TABS</h1>
        <div class="page-subtitle">Terp Account Billboards</div>

        <div class="name-card">
            <div class="name-input-wrap">
                <input type="text" class="name-input" id="name-input" placeholder="your-name" maxlength="64" autocomplete="off">
                <button class="btn-check" id="btn-check" onclick="checkName()">Check</button>
            </div>

            <div class="name-status" id="name-status"></div>

            <div class="pricing-info" id="pricing-info" style="display:none">
                <div class="pricing-item">
                    <div class="pricing-label">Base price</div>
                    <div class="pricing-value" id="base-price">--</div>
                </div>
                <div class="pricing-item">
                    <div class="pricing-label">Length (min / max)</div>
                    <div class="pricing-value" id="name-limits">--</div>
                </div>
                <div class="pricing-item">
                    <div class="pricing-label">Characters</div>
                    <div class="pricing-value" id="name-length">--</div>
                </div>
                <div class="pricing-item" id="mint-price-item" style="display:none">
                    <div class="pricing-label">Your price</div>
                    <div class="pricing-value" id="mint-price-display">--</div>
                </div>
            </div>

            <button class="btn-mint" id="btn-mint" onclick="mintName()" disabled style="display:none">
                Register Name
            </button>
        </div>

        <div class="loading" id="loading" style="display:none">
            <div class="spinner"></div>
            <p id="loading-text">Loading...</p>
        </div>
    </main>

    <div class="toast-container" id="toasts"></div>

    <script type="module">
        import { loadSiteConfig } from '/lib/config-loader.js';
        import { applyNavGuard } from '/lib/nav-guard.js';
        applyNavGuard();
        // ═══════════════════════════════════════════════════════════════
        // CONFIGURATION
        // ═══════════════════════════════════════════════════════════════

        const CONFIG = {
            chainId: "morocco-1",
            chainName: "Terp Network",
            rpc: "https://rpc.terp.network",
            rest: "https://api.terp.network",
            minterContract: "terp1yvgh8xeju5dyr0zxlkvq09htvhjj20fncp5g58np4u25g8rkpgjsgsyg5s",
            accountContract: "terp142kvnl56hs7jacmwysswlhp4f4eyt7ljclcy9ak7v3cgg3ldhzzs6ye4vu",
            explorerBase: "https://ping.pub/terp",
            bech32Prefix: "terp",
            denom: "uthiol",
            denomDisplay: "THIOL",
            denomDecimals: 6,
        };

        // Async config overlay — merge from config-loader (on-chain + static)
        loadSiteConfig(CONFIG).catch(() => {});

        const CHAIN_SUGGEST = {
            chainId: CONFIG.chainId,
            chainName: CONFIG.chainName,
            rpc: CONFIG.rpc,
            rest: CONFIG.rest,
            bip44: { coinType: 118 },
            bech32Config: {
                bech32PrefixAccAddr: "terp",
                bech32PrefixAccPub: "terppub",
                bech32PrefixValAddr: "terpvaloper",
                bech32PrefixValPub: "terpvaloperpub",
                bech32PrefixConsAddr: "terpvalcons",
                bech32PrefixConsPub: "terpvalconspub",
            },
            currencies: [
                { coinDenom: "TERP", coinMinimalDenom: "uterp", coinDecimals: 6 },
                { coinDenom: "THIOL", coinMinimalDenom: "uthiol", coinDecimals: 6 },
            ],
            feeCurrencies: [{
                coinDenom: "THIOL",
                coinMinimalDenom: "uthiol",
                coinDecimals: 6,
                gasPriceStep: { low: 0.01, average: 0.025, high: 0.04 },
            }],
            stakeCurrency: { coinDenom: "TERP", coinMinimalDenom: "uterp", coinDecimals: 6 },
        };

        // Auto-suggest chain to Keplr when testing on localhost
        if (window.location.hostname === "localhost" && window.keplr) {
            window.keplr.experimentalSuggestChain(CHAIN_SUGGEST).catch(() => {});
        }

        const COSMES_CHAIN_INFO = [{
            chainId: CONFIG.chainId,
            rpc: CONFIG.rpc,
            gasPrice: { amount: "0.025", denom: CONFIG.denom },
        }];

        // ═══════════════════════════════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════════════════════════════

        const state = {
            address: null,
            wallet: null,
            keplrController: null,
            libsLoaded: false,
            checkedName: null,       // name that was checked for availability
            nameAvailable: false,
            sudoParams: null,        // pricing params from contract
        };

        // ═══════════════════════════════════════════════════════════════
        // COSMES + CONTRACT CLIENT IMPORTS
        // ═══════════════════════════════════════════════════════════════

        let KeplrController, WalletType, queryContract, MsgExecuteContract;
        let AccountMinterQueryClient, AccountMinterClient;

        async function loadLibs() {
            try {
                const walletMod = await import("https://esm.sh/@goblinhunt/cosmes@0.0.71-ghunt.21/wallet");
                KeplrController = walletMod.KeplrController;
                WalletType = walletMod.WalletType;

                const clientMod = await import("https://esm.sh/@goblinhunt/cosmes@0.0.71-ghunt.21/client");
                queryContract = clientMod.queryContract;
                MsgExecuteContract = clientMod.MsgExecuteContract;

                const minterMod = await import("/lib/account-minter.js");
                AccountMinterQueryClient = minterMod.AccountMinterQueryClient;
                AccountMinterClient = minterMod.AccountMinterClient;

                state.libsLoaded = true;
                return true;
            } catch (err) {
                console.error("Failed to load libraries:", err);
                showToast("Failed to load blockchain libraries.", "error");
                return false;
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // COSMES ADAPTERS
        // ═══════════════════════════════════════════════════════════════

        function createQueryAdapter(rpc) {
            return {
                queryContractSmart: (addr, query) => queryContract(rpc, { address: addr, query }),
            };
        }

        function createSigningAdapter(wallet, rpc) {
            return {
                queryContractSmart: (addr, query) => queryContract(rpc, { address: addr, query }),
                execute: async (sender, contractAddress, msg, fee, memo, funds) => {
                    const execMsg = new MsgExecuteContract({
                        sender, contract: contractAddress, msg, funds: funds || [],
                    });
                    return wallet.broadcastTxSync({ msgs: [execMsg], memo: memo || "" }, 1.4);
                },
            };
        }

        // ═══════════════════════════════════════════════════════════════
        // WALLET
        // ═══════════════════════════════════════════════════════════════

        window.handleWalletClick = async function () {
            if (state.address) {
                disconnectWallet();
            } else {
                await connectWallet();
            }
        };

        async function connectWallet() {
            if (!window.keplr) {
                showToast("Please install the Keplr wallet extension", "error");
                window.open("https://www.keplr.app/download", "_blank");
                return;
            }

            if (!state.libsLoaded) {
                showToast("Libraries still loading, please try again", "info");
                return;
            }

            const btn = document.getElementById("btn-wallet");
            btn.textContent = "Connecting...";
            btn.disabled = true;

            try {
                await window.keplr.experimentalSuggestChain(CHAIN_SUGGEST);

                if (!state.keplrController) {
                    state.keplrController = new KeplrController("");
                }

                const wallets = await state.keplrController.connect(
                    WalletType.EXTENSION,
                    COSMES_CHAIN_INFO
                );

                const wallet = wallets.get(CONFIG.chainId);
                if (!wallet) {
                    showToast("Failed to connect to " + CONFIG.chainName, "error");
                    return;
                }

                state.wallet = wallet;
                state.address = wallet.address;
                localStorage.setItem("terp-names-address", wallet.address);

                updateWalletUI();
                showToast(`Connected: ${wallet.address.slice(0, 10)}...${wallet.address.slice(-6)}`, "success");
                updateMintButton();
            } catch (err) {
                console.error("Wallet connect failed:", err);
                const msg = (err.message || "").toLowerCase();
                if (msg.includes("reject")) {
                    showToast("Connection rejected by user", "info");
                } else {
                    showToast("Failed to connect wallet", "error");
                }
            } finally {
                btn.disabled = false;
                updateWalletUI();
            }
        }

        function disconnectWallet() {
            if (state.keplrController) {
                state.keplrController.disconnect([CONFIG.chainId]);
            }
            state.address = null;
            state.wallet = null;
            localStorage.removeItem("terp-names-address");
            updateWalletUI();
            updateMintButton();
            showToast("Wallet disconnected", "info");
        }

        function updateWalletUI() {
            const btn = document.getElementById("btn-wallet");
            if (state.address) {
                btn.textContent = state.address.slice(0, 8) + "..." + state.address.slice(-4);
                btn.classList.add("connected");
            } else {
                btn.textContent = "Connect Wallet";
                btn.classList.remove("connected");
            }
        }

        async function tryReconnect() {
            const saved = localStorage.getItem("terp-names-address");
            if (!saved || !window.keplr || !state.libsLoaded) return;

            try {
                if (!state.keplrController) {
                    state.keplrController = new KeplrController("");
                }
                const wallets = await state.keplrController.connect(
                    WalletType.EXTENSION,
                    COSMES_CHAIN_INFO
                );
                const wallet = wallets.get(CONFIG.chainId);
                if (wallet && wallet.address === saved) {
                    state.wallet = wallet;
                    state.address = saved;
                    updateWalletUI();
                } else {
                    localStorage.removeItem("terp-names-address");
                }
            } catch {
                localStorage.removeItem("terp-names-address");
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // NAME LOOKUP & MINTING
        // ═══════════════════════════════════════════════════════════════

        window.checkName = async function () {
            const input = document.getElementById("name-input");
            const statusEl = document.getElementById("name-status");
            const name = input.value.trim().toLowerCase();

            if (!name) {
                statusEl.className = "name-status error";
                statusEl.textContent = "Please enter a name.";
                statusEl.style.display = "block";
                return;
            }

            if (!CONFIG.minterContract) {
                statusEl.className = "name-status error";
                statusEl.textContent = "Name registry not configured yet.";
                statusEl.style.display = "block";
                return;
            }

            if (!state.libsLoaded) {
                statusEl.className = "name-status error";
                statusEl.textContent = "Libraries still loading...";
                statusEl.style.display = "block";
                return;
            }

            // Validate length against params
            if (state.sudoParams) {
                if (name.length < state.sudoParams.min_account_length) {
                    statusEl.className = "name-status error";
                    statusEl.textContent = `Name too short. Minimum ${state.sudoParams.min_account_length} characters.`;
                    statusEl.style.display = "block";
                    return;
                }
                if (name.length > state.sudoParams.max_account_length) {
                    statusEl.className = "name-status error";
                    statusEl.textContent = `Name too long. Maximum ${state.sudoParams.max_account_length} characters.`;
                    statusEl.style.display = "block";
                    return;
                }
            }

            const btn = document.getElementById("btn-check");
            btn.disabled = true;
            btn.textContent = "Checking...";
            statusEl.style.display = "none";

            try {
                const adapter = createQueryAdapter(CONFIG.rpc);
                const minterQuery = new AccountMinterQueryClient(adapter, CONFIG.minterContract);

                // Check if name has an existing ask (means it's minted)
                const ask = await minterQuery.ask({ tokenId: name });

                if (ask) {
                    state.checkedName = name;
                    state.nameAvailable = false;
                    statusEl.className = "name-status taken";
                    statusEl.textContent = `"${name}" is already taken.`;
                    statusEl.style.display = "block";
                } else {
                    state.checkedName = name;
                    state.nameAvailable = true;
                    statusEl.className = "name-status available";
                    statusEl.textContent = `"${name}" is available!`;
                    statusEl.style.display = "block";
                }
            } catch (err) {
                // If ask query returns an error, name likely doesn't exist = available
                const errStr = (err.message || "").toLowerCase();
                if (errStr.includes("not found") || errStr.includes("does not exist")) {
                    state.checkedName = name;
                    state.nameAvailable = true;
                    statusEl.className = "name-status available";
                    statusEl.textContent = `"${name}" is available!`;
                    statusEl.style.display = "block";
                } else {
                    statusEl.className = "name-status error";
                    statusEl.textContent = `Error checking name: ${err.message || err}`;
                    statusEl.style.display = "block";
                }
            } finally {
                btn.disabled = false;
                btn.textContent = "Check";
                updateMintButton();
            }
        };

        function updateMintButton() {
            const btn = document.getElementById("btn-mint");
            if (state.nameAvailable && state.checkedName) {
                btn.style.display = "block";
                btn.disabled = !state.address;
                btn.textContent = state.address
                    ? `Register "${state.checkedName}"`
                    : "Connect Wallet to Register";
            } else {
                btn.style.display = "none";
            }
        }

        window.mintName = async function () {
            if (!state.address || !state.wallet || !state.checkedName || !state.nameAvailable) return;

            if (!CONFIG.minterContract) {
                showToast("Name registry not configured.", "error");
                return;
            }

            const btn = document.getElementById("btn-mint");
            btn.textContent = "Registering...";
            btn.disabled = true;

            try {
                const funds = [];
                if (state.sudoParams?.base_price) {
                    funds.push({ denom: CONFIG.denom, amount: state.sudoParams.base_price });
                }

                // 1. approve_all: grant the manifold contract operator rights on the collection
                const approveMsg = new MsgExecuteContract({
                    sender: state.address,
                    contract: CONFIG.accountContract,
                    msg: { approve_all: { operator: CONFIG.minterContract } },
                    funds: [],
                });

                // 2. mint_and_list: mint the name through the manifold
                const mintMsg = new MsgExecuteContract({
                    sender: state.address,
                    contract: CONFIG.minterContract,
                    msg: { mint_and_list: { account: state.checkedName } },
                    funds: funds,
                });

                const result = await state.wallet.broadcastTxSync(
                    { msgs: [approveMsg, mintMsg], memo: "" }, 1.4
                );

                const txHash = result?.hash || result?.transactionHash || result || "";
                showToast(`Name "${state.checkedName}" registered! TX: ${typeof txHash === "string" ? txHash.slice(0, 12) + "..." : ""}`, "success");

                state.nameAvailable = false;
                state.checkedName = null;
                document.getElementById("name-input").value = "";
                document.getElementById("name-status").style.display = "none";
                updateMintButton();
            } catch (err) {
                console.error("Mint failed:", err);
                const errStr = (err.message || "").toLowerCase();
                if (errStr.includes("reject")) {
                    showToast("Transaction rejected", "info");
                } else if (errStr.includes("insufficient")) {
                    showToast("Insufficient funds for registration.", "error");
                } else {
                    showToast(`Registration failed: ${err.message || err}`, "error");
                }
            } finally {
                btn.disabled = false;
                updateMintButton();
            }
        };

        // ═══════════════════════════════════════════════════════════════
        // PRICING
        // ═══════════════════════════════════════════════════════════════

        function computeNamePrice(len, params) {
            if (!params || !len) return null;
            const base = parseInt(params.base_price || "0");
            const mult = len <= 3 ? 100 : len === 4 ? 10 : 1;
            return { amount: String(base * mult), denom: CONFIG.denom };
        }

        function formatPrice(amountStr) {
            const num = parseInt(amountStr || "0") / Math.pow(10, CONFIG.denomDecimals);
            return num.toLocaleString(undefined, { maximumFractionDigits: 6 }) + " " + CONFIG.denomDisplay;
        }

        function updateLivePrice() {
            const len = document.getElementById("name-input").value.trim().length;
            const item = document.getElementById("mint-price-item");
            const display = document.getElementById("mint-price-display");
            if (!state.sudoParams || len < 3) { item.style.display = "none"; return; }
            const price = computeNamePrice(len, state.sudoParams);
            if (!price) { item.style.display = "none"; return; }
            display.textContent = formatPrice(price.amount);
            item.style.display = "";
        }

        async function fetchParams() {
            if (!CONFIG.minterContract || !state.libsLoaded) return;

            try {
                const adapter = createQueryAdapter(CONFIG.rpc);
                const minterQuery = new AccountMinterQueryClient(adapter, CONFIG.minterContract);
                state.sudoParams = await minterQuery.params();

                const pricingEl = document.getElementById("pricing-info");
                const priceNum = parseInt(state.sudoParams.base_price || "0") / Math.pow(10, CONFIG.denomDecimals);
                document.getElementById("base-price").textContent = priceNum.toLocaleString() + " " + CONFIG.denomDisplay;
                document.getElementById("name-limits").textContent = `${state.sudoParams.min_account_length} / ${state.sudoParams.max_account_length}`;
                pricingEl.style.display = "flex";
            } catch (err) {
                console.warn("Failed to fetch params:", err);
            }
        }

        // ═══════════════════════════════════════════════════════════════
        // TOASTS
        // ═══════════════════════════════════════════════════════════════

        function showToast(message, type = "info") {
            const container = document.getElementById("toasts");
            const toast = document.createElement("div");
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("removing");
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ═══════════════════════════════════════════════════════════════
        // BACKGROUND CANVAS
        // ═══════════════════════════════════════════════════════════════

        (function initBackground() {
            const canvas = document.getElementById("glow-canvas");
            const ctx = canvas.getContext("2d");
            let width, height, centerX, centerY, time = 0;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                centerX = width / 2;
                centerY = height / 2;
            }
            resize();
            window.addEventListener("resize", resize);

            const orbPositions = [
                { x: 0, y: 0, size: 0.9, brightness: 1.0 },
                { x: -1, y: 0, size: 0.85, brightness: 0.9 },
                { x: 1, y: 0, size: 0.85, brightness: 0.9 },
                { x: 0, y: -1, size: 0.85, brightness: 0.9 },
                { x: 0, y: 1, size: 0.85, brightness: 0.9 },
                { x: -1, y: -1, size: 0.8, brightness: 0.85 },
                { x: 1, y: -1, size: 0.8, brightness: 0.85 },
                { x: -1, y: 1, size: 0.8, brightness: 0.85 },
                { x: 1, y: 1, size: 0.8, brightness: 0.85 },
                { x: -2, y: 0, size: 0.75, brightness: 0.75 },
                { x: 2, y: 0, size: 0.75, brightness: 0.75 },
                { x: 0, y: -2, size: 0.75, brightness: 0.75 },
                { x: 0, y: 2, size: 0.75, brightness: 0.75 },
            ];

            const glowColor = { r: 200, g: 255, b: 210 };

            function drawOrb(x, y, baseRadius, brightness, pulseOffset) {
                const pulse = 1 + 0.03 * Math.sin(time * 0.0008 + pulseOffset);
                const radius = baseRadius * pulse;
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                const alpha = brightness * 0.7;
                gradient.addColorStop(0, `rgba(${glowColor.r},${glowColor.g},${glowColor.b},${alpha})`);
                gradient.addColorStop(0.15, `rgba(${glowColor.r},${glowColor.g},${glowColor.b},${alpha * 0.85})`);
                gradient.addColorStop(0.35, `rgba(${glowColor.r},${glowColor.g},${glowColor.b},${alpha * 0.55})`);
                gradient.addColorStop(0.55, `rgba(${glowColor.r},${glowColor.g},${glowColor.b},${alpha * 0.3})`);
                gradient.addColorStop(0.75, `rgba(${glowColor.r},${glowColor.g},${glowColor.b},${alpha * 0.12})`);
                gradient.addColorStop(1, `rgba(${glowColor.r},${glowColor.g},${glowColor.b},0)`);
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }

            function draw(timestamp) {
                time = timestamp;
                ctx.fillStyle = "#000000";
                ctx.fillRect(0, 0, width, height);
                const gridUnit = Math.min(width, height) * 0.14;
                const orbRadius = gridUnit * 1.1;

                orbPositions.forEach((orb, i) => {
                    drawOrb(
                        centerX + orb.x * gridUnit,
                        centerY + orb.y * gridUnit,
                        orbRadius * orb.size,
                        orb.brightness,
                        i * 0.4
                    );
                });

                requestAnimationFrame(draw);
            }

            requestAnimationFrame(draw);
        })();

        // ═══════════════════════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════════════════════

        async function init() {
            await loadLibs();
            await tryReconnect();
            await fetchParams();

            // Update name-length display on input
            const nameInput = document.getElementById("name-input");
            nameInput.addEventListener("input", () => {
                const len = nameInput.value.trim().length;
                document.getElementById("name-length").textContent = len > 0 ? `${len} chars` : "--";
                updateLivePrice();
                // Reset availability if name changed
                if (state.checkedName && nameInput.value.trim().toLowerCase() !== state.checkedName) {
                    state.nameAvailable = false;
                    state.checkedName = null;
                    document.getElementById("name-status").style.display = "none";
                    updateMintButton();
                }
            });
        }

        init().catch(err => {
            console.error("Init failed:", err);
        });
    </script>
